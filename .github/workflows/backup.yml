# Backup semanal do banco (o Supabase Free não faz backup restaurável).
# Requer o secret SUPABASE_DB_URL (Settings > Database > Connection string, modo Session pooler).
# O arquivo fica como artefato privado do GitHub por 30 dias. Sem o secret, o job só avisa e termina.
name: backup
on:
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Verificar secret
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_DB_URL não configurado; backup ignorado."; exit 0; fi
      - name: Dump
        if: env.DB_URL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public -Fc -f backup.dump
      - uses: actions/upload-artifact@v4
        if: env.DB_URL != ''
        with:
          name: backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
