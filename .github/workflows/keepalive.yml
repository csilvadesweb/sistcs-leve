# Mantém o projeto Supabase ativo com credenciais configuradas no GitHub.
# Não manter chaves de API em texto literal no workflow; o ping usa apenas uma chave pública.
name: keepalive
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Validar configuração do ping
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no repositório antes de ativar o keepalive."
            exit 1
          fi
      - name: Consultar endpoint REST com chave pública
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            "$SUPABASE_URL/rest/v1/profiles?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept: application/json" \
            --output /dev/null
