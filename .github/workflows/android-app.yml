name: Android App (SISTCS Leve)

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-twa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK do SISTCS Leve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK assinado
        working-directory: android-twa
        run: |
          if ! gradle --no-daemon assembleRelease > build.log 2>&1; then
            MSG=$(grep -E -A6 "What went wrong|error:|Error:|FAILED" build.log | head -20 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle falhou::$MSG"
            tail -30 build.log
            exit 1
          fi
      - name: Conferir fingerprint da assinatura
        run: |
          APK=$(ls android-twa/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SIG=$("$APKSIGNER" verify --print-certs "$APK" | grep "SHA-256 digest" | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F')
          EXPECTED=$(grep -o '[0-9A-F:]\{95\}' public/.well-known/assetlinks.json | head -1 | tr -d ':')
          echo "APK: $APK"
          echo "Assinatura do APK: $SIG"
          echo "assetlinks.json:   $EXPECTED"
          if [ "$SIG" != "$EXPECTED" ]; then echo "::error::Fingerprint do APK diferente do assetlinks.json"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: sistcs-leve-app
          path: android-twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
