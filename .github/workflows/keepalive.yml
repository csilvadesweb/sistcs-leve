# Mantém o projeto Supabase ativo com uma verificação pública de saúde.
# Usa apenas a chave publicável; não consulta tabelas de negócio nem depende de RLS de usuário.
name: keepalive
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Valores públicos (a URL e a chave publicável já vão embutidas no app). Os secrets, se existirem, têm prioridade.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://yzcmxdbnitturlbozvqu.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_8NA8UB_55isWrQJawod7OQ_tvNKEJNz' }}
    steps:
      - name: Validar configuração do ping
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY ausentes."
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::SUPABASE_URL deve ser a URL HTTPS do projeto Supabase."
            exit 1
          fi
      - name: Verificar endpoint de saúde do Auth
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            --max-time 15 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept: application/json" \
            --output /dev/null
