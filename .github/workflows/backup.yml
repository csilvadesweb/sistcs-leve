# Backup semanal do banco (o Supabase Free não faz backup restaurável).
# Requer o secret SUPABASE_DB_URL: a connection string do Session pooler (IPv4) do Supabase, com a senha do banco.
# O repositório é PÚBLICO: o dump é criptografado (AES-256) com o secret BACKUP_PASSPHRASE antes de virar artefato.
# Sem SUPABASE_DB_URL ou sem BACKUP_PASSPHRASE o job falha explicitamente.
name: backup
on:
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar secret
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::SUPABASE_DB_URL ou BACKUP_PASSPHRASE não configurado; backup não pode ser considerado válido."; exit 1; fi
      - name: Dump
        if: env.DB_URL != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          # O banco é Postgres 17: o pg_dump precisa ser da mesma versão (ou maior).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
          HOSTPORT=$(echo "$DB_URL" | sed -E 's#^[a-z]+://[^@]*@([^/?]*).*#\1#')
          USERPART=$(echo "$DB_URL" | sed -E 's#^[a-z]+://([^:@]*).*#\1#')
          echo "host:porta=$HOSTPORT usuario=$USERPART"
          if ! /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges --schema=public -Fc -f backup.dump 2> dump.err; then
            MSG=$(tr '\n' ' ' < dump.err | cut -c1-400)
            echo "::error title=pg_dump falhou::$MSG | $HOSTPORT | usuario=$USERPART"
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o backup.dump.gpg backup.dump
          rm -f backup.dump dump.err
      - uses: actions/upload-artifact@v7
        if: env.DB_URL != '' && env.BACKUP_PASSPHRASE != ''
        with:
          name: backup-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 30
