name: Android Health Connect

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-health-connect/**'
      - '.github/workflows/android-health-connect.yml'
  push:
    branches: [main]
    paths:
      - 'android-health-connect/**'
      - '.github/workflows/android-health-connect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-health-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build companion Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test Android companion
        working-directory: android-health-connect
        run: gradle --no-daemon test assembleDebug
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sistcs-leve-health-connect-debug
          path: android-health-connect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
